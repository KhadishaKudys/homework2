plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
dependencies {
    runtimeOnly 'org.postgresql:postgresql:42.7.14'
    implementation 'org.postgresql:postgresql:42.7.14'
}

application {
    mainClass = 'RestartBlocking'
}